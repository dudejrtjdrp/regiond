# 클라이언트(public/)를 GitHub Pages 로 발행한다 — docs/DEPLOY2.md §4-4.
#   주소: https://dudejrtjdrp.github.io/tojiGame/
#   ★ 한 번만 해 둘 것: 저장소 Settings → Pages → Source 를 `GitHub Actions` 로.
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 밑줄로 시작하는 파일이 사라지지 않게 Jekyll 을 끈다(저장소에도 두지만 없어도 서게 한다)
      - run: touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
