<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2b1d12">
<title>Regiond</title>
<!-- ★ 파비콘 — 모든 경로는 상대경로다. Pages(`/regiond/` 하위)에서도 그대로 뜬다. -->
<link rel="icon" href="assets/regiond-icon-purple-transparent/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="assets/regiond-icon-purple-transparent/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/regiond-icon-purple-transparent/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/regiond-icon-purple-transparent/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/regiond-icon-purple-transparent/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<!-- ★ 연출·메뉴용 세리프 폰트(Noto Serif KR, OFL) — CDN 없이 저장소에 동봉한다 -->
<link rel="stylesheet" href="assets/fonts/noto-serif-kr/noto-serif-kr.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ══════ 장면 0 · 불러오는 중 ══════
     첫 화면이 뜨기 전에 그림을 미리 받아 둔다. 예전에는 타이틀이 곧장 떠 놓고
     뒤에서 몰래 받느라, 새로하기를 누른 첫 몇 초가 늘 버벅였다. 기다림을 숨기지 않고 보여 준다.
     ★ 안전장치 — 무슨 일이 있어도 BOOT_MAX_MS 뒤에는 반드시 걷힌다(그림 못 받아도 게임은 열린다). -->
<div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
  <div class="boot-inner">
    <h1 class="boot-logo">Regiond</h1>
    <p class="boot-say">게임을 불러오는 중…</p>
    <div class="boot-bar"><i id="boot-fill" class="boot-fill"></i></div>
    <p id="boot-count" class="boot-count">0%</p>
    <p id="boot-tip" class="boot-tip">마차가 멈춘 자리에 모닥불 하나.</p>
  </div>
</div>

<!-- ══════ 배경 장식 (항상 맨 뒤 · 클릭 통과) ══════
     규칙: 장식 요소는 반드시 class="decor" + pointer-events:none. harness/check_ui.mjs 가 검사한다. -->
<canvas id="sky" class="decor sky" aria-hidden="true"></canvas>

<!-- ══════ 장면 1 · 타이틀 ══════ -->
<section id="scene-title" class="scene scene-title">
  <!-- ★ 메인 홈 일러스트에 메뉴 문구(새로하기·이어하기·멀티플레이)가 구워져 있다.
       판(plate)을 상단 기준으로 세워 로고가 잘리지 않게 하고, 글자 위에는 투명 핫스팟만 얹는다
       (호버하면 그 자리가 밝아지고 금줄이 선다 — main.css .title-hot). -->
  <div class="title-plate">
    <button id="btn-new" type="button" class="title-hot" aria-label="새로하기" title="새로하기"></button>
    <button id="btn-load" type="button" class="title-hot" aria-label="이어하기" title="이어하기"></button>
    <button id="btn-join" type="button" class="title-hot" aria-label="멀티플레이" title="멀티플레이"></button>
  </div>
  <div class="title-wrap" hidden>
    <canvas id="crest" class="decor crest" aria-hidden="true" width="240" height="180"></canvas>
    <h1 class="game-logo">Regiond</h1>
    <p class="game-tag">마차가 멈춘 자리에 모닥불 하나. 도끼질로 시작해 정착지를 키운다.</p>
  </div>
  <p id="title-status" class="scene-status" role="status"></p>
  <p class="scene-foot">서버 없이 화면만 둘러보려면 주소 끝에 <code>?mock=1</code></p>
</section>

<!-- ══════ 장면 2 · 새로하기 ══════
     ★ 홈(타이틀)·메뉴 판과 같은 옷 — 배경은 메인 일러스트, 판은 양피지 타일 액자(assets/ui/tile_square),
       이름 칸은 슬롯 그림(assets/ui/menu/slot.png), 큰 단추는 파란 판(assets/ui/menu/btn_blue.png),
       글은 세리프(main.css .found-*). 「뒤로」는 판 바깥 아래 가운데에 글자만 선다.
     ★ 「그대의 모습」(외형 선택)은 뺐다 — 주민 NPC 로 모습이 통일이라 고를 것이 없다. -->
<section id="scene-found" class="scene scene-found" hidden>
  <div class="found-wrap">
    <h2 class="found-title">새로하기</h2>
    <p class="found-sub">새로운 여정을 시작하세요</p>

    <input id="found-name" class="found-name-in" type="text" maxlength="16"
           placeholder="그대의 이름" autocomplete="off" spellcheck="false">
    <p id="found-kingdom" class="kingdom-preview">이름을 적으면 정착지의 이름이 정해집니다.</p>

    <h3 class="found-sec">어떤 길로 갈까</h3>
    <div id="found-diff" class="diff-grid"></div>

    <div class="found-go">
      <button id="found-start" type="button" class="found-primary" disabled>마차에 오른다</button>
      <p id="found-summary" class="found-summary"></p>
    </div>

    <details id="found-custom" class="fold">
      <summary>보조 옵션</summary>
      <label class="switch">
        <input id="found-assist" type="checkbox" checked>
        <span class="sw-box"></span>
        <span>자리를 비운 사이 정착지가 알아서 굴러가게 한다</span>
      </label>
      <p class="hint">역할은 마을(주민 12명)이 되는 날 「감정의 날」에 정해집니다.</p>
    </details>

    <!-- ★ 뒤로 — 메뉴 판들과 같이 판 **안** 아래 가운데(판이 길어도 화면 밖으로 밀려나지 않는다) -->
    <button id="found-back" type="button" class="found-back">뒤로</button>
  </div>

  <p id="found-status" class="scene-status" role="status"></p>
</section>

<!-- ══════ 장면 3 · 멀티플레이 / 이어하기 ══════
     한 장면이 두 낯을 가진다 — [멀티플레이](닉네임·초대 코드·파티 참가·방 만들기)와
     [이어하기](초대 코드·여정 불러오기). 판은 일러스트 액자(assets/ui/menu)이고
     제목·부제·입력·단추는 그 홈 위에 얹는다(main.css .menu-panel). -->
<section id="scene-load" class="scene scene-menu" hidden>
  <div id="menu-panel" class="menu-panel mode-join">
    <h2 id="menu-title" class="menu-title">멀티플레이</h2>
    <p id="menu-sub" class="menu-sub">동료와 함께 여정을 시작하세요</p>
    <input id="load-name" class="menu-in menu-in-name" type="text" maxlength="16"
           placeholder="닉네임" autocomplete="off">
    <input id="load-gameid" class="menu-in menu-in-code" type="text"
           placeholder="초대 코드" autocomplete="off" spellcheck="false">
    <button id="load-go" type="button" class="menu-primary">파티 참가</button>
    <button id="load-create" type="button" class="menu-secondary">방 만들기</button>
    <button id="load-back" type="button" class="menu-back">뒤로</button>
  </div>
  <p id="load-status" class="scene-status" role="status"></p>
</section>

<!-- ══════ 게임 화면 ══════ -->
<div id="shell" class="shell" hidden>

  <!-- 상단 자원 바 -->
  <header id="topbar" class="topbar">
    <div id="res-bar" class="res-bar" aria-label="창고"></div>
    <div class="topbar-right">
      <span id="tb-kingdom" class="tb-kingdom"></span>
      <!-- ★ 「내 모습」(군주 외형 편집)은 뺐다 — 주민 NPC 로 모습 통일, 커스터마이징 없음 -->
      <button id="btn-chronicle" type="button" class="icon-btn" aria-label="연대기" title="연대기">✎</button>
      <button id="btn-sound" type="button" class="icon-btn" aria-label="소리 켜기·끄기" title="소리">♪</button>
      <button id="btn-settings" type="button" class="icon-btn" aria-label="설정" title="설정 (Esc)">⚙</button>
      <button id="btn-help" type="button" class="icon-btn" aria-label="도움말" title="도움말">?</button>
    </div>
  </header>

  <!-- 중앙 무대 — 월드 캔버스가 주인공이다 -->
  <div id="stage" class="stage">
    <canvas id="world-canvas" class="world-canvas" tabindex="0" aria-label="우리 땅"></canvas>

    <div class="hud hud-tl">
      <div id="badge-tier" class="tier-badge"></div>
      <div id="badge-day" class="cal-badge"></div>
      <!-- GDD3 §15-C — 자동 플레이가 도는 동안 켜지는 표시 -->
      <div id="badge-auto" class="auto-badge" hidden>자동</div>
      <!-- ★ GDD3 §16-16 — 다가오는 것들: 웨이브·연구·주민·승격 카운트다운 -->
      <div id="upcoming" class="upcoming decor" aria-hidden="true" hidden></div>
      <button id="badge-threat" type="button" class="inv-badge" hidden></button>
      <div id="goal-card" class="goal-card" hidden></div>
      <div id="artifact-track-card" class="artifact-track-card" hidden></div>
      <button id="artifact-journal-btn" class="artifact-journal-btn" type="button"><img class="aj-ic" src="assets/ui/codex/icon_discovery.png" alt="">발견 기록</button>
      <button id="artifact-inventory-btn" class="artifact-journal-btn" type="button"><img class="aj-ic" src="assets/ui/codex/icon_artifact.png" alt="">유물 보관함</button>
    </div>

    <div id="battle-bar" class="battle-bar" hidden></div>

    <div id="notices" class="notices" aria-label="알림"></div>

    <aside id="social-panel" class="social-panel" aria-label="함께 개척하는 이들"></aside>

    <div id="minimap-wrap" class="minimap-wrap">
      <canvas id="minimap" class="minimap" aria-label="축소 지도"></canvas>
    </div>

    <div id="place-bar" class="place-bar" hidden></div>

    <div id="context-panel" class="ctx-panel" hidden></div>

    <!-- ★ GDD3 §14-5 — 나의 상태: 초상 · HP · XP · 레벨 -->
    <div id="me-panel" class="me-panel" aria-label="나의 상태" hidden></div>

    <div id="toolbar" class="toolbar"></div>

    <footer id="cabinet" class="cabinet" hidden></footer>

    <div id="vignette" class="decor vignette" aria-hidden="true"></div>
  </div>
</div>

<!-- 이펙트 층 — 자원 팝이 월드에서 상단 자원칸까지 날아간다 (항상 클릭 통과) -->
<canvas id="fx-layer" class="decor fx-layer" aria-hidden="true"></canvas>

<!-- 공용 레이어 -->
<!-- ★ GDD3 §13-D-1 — 새 사람이 올 때 뜨는 능력치 카드가 여기에 쌓인다 -->
<div id="fx-cards" class="fx-cards" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="banner-root" class="banner-root" aria-live="polite"></div>
<!-- ★ §19-D — 화면 한가운데 큰 제목(새 땅에 들어설 때 · 날이 바뀔 때). 장식이라 클릭을 먹지 않는다. -->
<div id="epic-root" class="epic-root decor" aria-live="polite"></div>
<div id="tooltip" class="tooltip decor" role="tooltip" hidden></div>
<div id="modal-root"></div>
<div id="coach-root"></div>
<!-- ★ §17-19(D-5) — 대화창(탐험기획 §18-6). 지도를 덮지 않고 화면 아래에서만 말한다. -->
<div id="dialogue-root"></div>
<div id="cutscene-root"></div>

<!-- 개발 패널 (Ctrl+` 로만 열린다) -->
<aside id="dev-panel" class="dev-panel" hidden></aside>

<!-- ══════════ ★ 배포 D-1 — 서버 주소 (docs/DEPLOY2.md §4-2) ══════════
     클라 사본은 GitHub Pages 에 얹히고 서버는 딴 데 있다. 그 둘을 잇는 **한 줄**이 여기다 —
     호스팅을 갈아탈 때 고칠 곳은 아래 SERVER 한 줄뿐이다(심사 중 이중화도 이 한 줄로 한다).
     서버가 직접 내려준 사본(로컬 npm start·같은 도메인)에서는 빈 문자열이라 옛날처럼 상대경로로 돈다. -->
<script>
  window.GM = window.GM || {};
  GM.SERVER = (function () {
    var q = new URLSearchParams(location.search).get('server');
    if (q) return q.replace(/\/+$/, '');                      // ?server=... 로 그 자리에서 갈아끼운다
    var remote = /\.github\.io$/.test(location.hostname) || location.protocol === 'file:';
    if (!remote) return '';                                   // 서버가 내려준 사본 = 같은 출처
    return 'https://gallaemallae-production.up.railway.app';  // ★ D-2 에서 확정하면 이 줄만 고친다
  })();
</script>
<!-- ══════════ 불러오는 중 — 그림을 먼저 받아 두고 첫 화면을 연다 ══════════
     「왜」 — 예전에는 타이틀이 곧장 뜨고 그림은 뒤에서 받았다. 그래서 새로하기를 누른 뒤
     첫 몇 초, 그리고 **처음 가 보는 땅에 닿을 때마다** 화면이 끊겼다. 받을 것을 먼저 받는다.
     여기서 받아 둔 그림은 브라우저 곳간에 남으므로, 아래 스크립트들이 같은 주소를 다시
     부를 때는 값을 치르지 않는다. 게임의 그림·기능은 한 가지도 바뀌지 않는다. -->
<script>
(function () {
  var BOOT_MAX_MS = 12000;              // 무슨 일이 있어도 이 뒤에는 걷는다
  var DIRS = ['south', 'sw', 'west', 'nw', 'north', 'ne', 'east', 'se'];
  var TIPS = [
    '마차가 멈춘 자리에 모닥불 하나.',
    '도끼질 한 번이 정착지의 첫 획이다.',
    '주민은 맡긴 일만 한다 — 무엇을 맡길지가 곧 그 땅의 얼굴이다.',
    '밤에는 등불이 켜진다. 불빛이 닿는 데까지가 오늘의 우리 땅이다.'
  ];
  var list = [];
  function add(p) { list.push(p); }
  /* ① 사람 — 걷기 스트립(방향당 한 장). 지도에 서자마자 쓰인다. */
  ['male', 'female'].forEach(function (s) {
    DIRS.forEach(function (d) { add('assets/player/npc-walk-strip/' + s + '/' + d + '.png'); });
  });
  ['archer', 'mage', 'saint', 'tactician', 'tank', 'warrior'].forEach(function (s) {
    DIRS.forEach(function (d) { add('assets/player/role-walk-strip/' + s + '/' + d + '.png'); });
  });
  /* ② 도구 동작 시트 */
  ['male', 'female', 'archer', 'mage', 'saint', 'tactician', 'tank', 'warrior']
    .forEach(function (s) { add('assets/player/action-8dir/' + s + '.png?v=action-8dir-v9'); });
  /* ③ 땅 — 바이옴 열셋의 바닥. 이것이 늦으면 처음 가는 땅이 밋밋하게 뜬다. */
  ['grass', 'forest', 'rock', 'water', 'fertile', 'snow', 'jungle',
   'desert', 'marsh', 'ash', 'mush', 'salt', 'dusk']
    .forEach(function (c) { add('assets/tileset/' + c + '/base-v4.png'); });
  /* ④ 첫 화면과 처음 서는 건물 몇 채 */
  add('assets/cutscene/title/main.png');
  ['campfire', 'tent', 'hut', 'house', 'well', 'woodpile', 'granary', 'storage_crate']
    .forEach(function (k) { add('assets/building/' + k + '/base.png?v=handmade-buildings-4'); });

  var BOOT_MIN_MS = 1100;               // 곳간에 다 들어 있어도 이만큼은 보여 준다(깜빡이지 않게)
  var startedAt = Date.now();
  var total = list.length, done = 0, settled = false, pageLoaded = false;
  var fill = document.getElementById('boot-fill');
  var count = document.getElementById('boot-count');
  var tip = document.getElementById('boot-tip');
  var screen = document.getElementById('boot-screen');
  if (tip) tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

  /* ── 두 번째 기다림 — 개척을 시작한 직후 ──────────────────────
     「왜」 또 필요한가 — 첫 화면에서 받아 둔 것은 「메뉴와 사람」뿐이다. 알현실 그림·마차·
     건물 쉰 채는 그때 처음 불린다. 그래서 새로하기를 누르고 이야기가 흐르는 동안 화면이
     끊겼다. 지도가 서는 순간 여기서 한 번 더 받아 두고, 다 받은 뒤에 이야기를 연다.
     app.js 의 S.on('world') 가 이 문을 지난 뒤에 오프닝을 튼다. */
  /* 개척이 시작될 때 받아 둘 것 — 이야기(알현실·마차)와 그 뒤에 곧바로 서는 것들.
     ★ 순서가 뜻이다: 먼저 보이는 것을 앞에 둔다(늦게 받아도 늦게 쓰인다). */
  var GAME_ASSETS = (function () {
    var a = [];
    /* ⓪ 땅 — 이것이 먼저다. 커튼 뒤에서 청크를 구우려면(world.js warmStart) 바닥 그림이
       먼저 실려 있어야 한다. 안 그러면 절차 그림으로 굽혔다가 통째로 다시 버린다. */
    ['grass', 'forest', 'rock', 'water', 'fertile', 'snow', 'jungle',
     'desert', 'marsh', 'ash', 'mush', 'salt', 'dusk']
      .forEach(function (c) { a.push('assets/tileset/' + c + '/base-v4.png'); });
    /* ① 이야기 — 알현실이 먼저, 마차는 그 뒤(§세계관 W2). 한 장이 1672×941 이라 여기서 가장 무겁다. */
    ['throne_king', 'throne_player', 'capital', 'wagon', 'ship', 'arrival']
      .forEach(function (k) { a.push('assets/cutscene/intro/' + k + '.png'); });
    /* ② 땅에 서는 것 — 건물 전종의 기본 모습(교체된 수작업 PNG는 이 주소를 쓴다) */
    ['campfire', 'tent', 'hut', 'house', 'manor', 'well', 'woodpile', 'granary', 'sawmill',
     'quarry_camp', 'storage_crate', 'storage', 'bloomery', 'trading_post', 'market',
     'watchpost', 'arrow_tower', 'barracks', 'ballista', 'cannon', 'frost_tower', 'flame_tower',
     'fence', 'gate', 'shrine', 'consulate', 'monument', 'appraisal_post', 'claim_flag',
     'lamp', 'banner', 'garden', 'fountain', 'library', 'workshop', 'academy', 'station',
     'hunter_hut', 'smelter', 'smithy', 'mill', 'ranch', 'mine_shaft',
     'hq_camp', 'hq_village', 'hq_town', 'hq_city', 'hq_royal']
      .forEach(function (k) { a.push('assets/building/' + k + '/base.png?v=handmade-buildings-4'); });
    /* ③ 캐는 것 · 베는 것 */
    ['forest_oak', 'forest_pine', 'forest_birch', 'forest_dead', 'rock_granite', 'rock_limestone',
     'iron_vein', 'coal_vein', 'salt_crystal', 'oil_pool', 'berry_bush_red', 'berry_bush_blue',
     'mushroom_cluster', 'water_spring', 'field_sown', 'field_sprout', 'field_grow', 'field_ripe',
     'cache_crate', 'supply_chest_v2', 'ruin_pillar']
      .forEach(function (k) { a.push('assets/node/' + k + '/base.png'); });
    /* ④ 들에 사는 것 — 사냥이 열리기 전에도 사슴·토끼는 걷는다 */
    ['deer', 'rabbit', 'chicken', 'sheep', 'pig', 'cow', 'snow_fox',
     'wolf', 'boar', 'bear', 'stray_dog', 'direwolf']
      .forEach(function (k) { a.push('assets/creature/' + k + '/sheet.png?v=wild-set-1'); });
    return a;
  })();

  var active = null;                     // 지금 올라 있는 커튼 — 둘을 겹쳐 올리지 않는다

  /** 커튼 한 장 — 이미 올라 있으면 그것을 그대로 쓴다. */
  function curtain() {
    if (active) return active;
    var el = document.createElement('div');
    el.className = 'boot-screen';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.innerHTML = '<div class="boot-inner">'
      + '<h1 class="boot-logo">Regiond</h1>'
      + '<p class="boot-say">게임을 불러오는 중…</p>'
      + '<div class="boot-bar"><i class="boot-fill"></i></div>'
      + '<p class="boot-count"></p>'
      + '<p class="boot-tip">' + TIPS[Math.floor(Math.random() * TIPS.length)] + '</p></div>';
    document.body.appendChild(el);
    active = el;
    return el;
  }

  window.GM.loading = {
    gameAssets: function () { return GAME_ASSETS.slice(); },
    /**
     * 커튼을 **미리** 올린다 — 개척에 들어서는 순간(app.js enterGame).
     * 「왜」 여기서부터인가 — 지도는 서버에서 온다. 그 틈에 지도판에는 「땅을 살피는 중…」이
     * 떴다가, 지도가 서면 다시 「불러오는 중」이 떴다. 기다림 하나를 두 낯으로 보여 준 셈이다.
     * 커튼을 먼저 올려 그 틈을 덮는다. 아래의 안내(world.js drawBootNotice)는 지우지 않았다 —
     * 지도를 끝내 못 받으면 커튼이 시간 끝에 걷히고 그 안내가 제 몫을 한다.
     */
    begin: function () {
      var el = curtain();
      var bar = el.querySelector('.boot-fill');
      var say = el.querySelector('.boot-say');
      /* 얼마나 남았는지 모르는 기다림이다 — 숫자로 속이지 않고 띠만 오간다. */
      if (bar) bar.style.width = '100%';
      el.classList.add('is-wait');
      if (say) say.textContent = '땅을 여는 중…';
    },
    /* urls  — 받아 둘 그림
       onDone— 커튼이 걷히기 직전에 부른다
       warm  — 그림을 다 받은 뒤 **프레임마다** 부르는 데우기. {done, ratio} 를 돌려준다.
               「왜」 두 걸음인가 — 그림을 받는 것과 그 그림으로 땅을 굽는 것은 다른 일이다.
               굽기는 프레임을 먹으므로 여기서 rAF 로 조금씩 돌린다(브라우저가 숨 쉴 틈을 준다). */
    run: function (urls, onDone, warm) {
      var el = curtain();
      el.classList.remove('is-wait');      // 이제부터는 진짜 진행률이 있다
      var bar = el.querySelector('.boot-fill');
      var num = el.querySelector('.boot-count');
      var n = urls.length, k = 0, over = false, began = Date.now();
      function close() {
        if (over) return;
        over = true;
        el.classList.add('is-gone');
        if (active === el) active = null;
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 420);
        if (onDone) onDone();
      }
      /* 띠는 세 몫이다 — 하는 일이 셋이라 그렇다.
           0~45%  그림 받기      (파일)
          45~80%  땅 굽기        (청크 — 줄 단위로 세므로 고르게 찬다)
          80~100% 자리 잡기      (몇 프레임을 미리 그려 보고, 값이 잦아들 때까지 기다린다)
         말(say)도 함께 바꾼다 — 무엇을 기다리는지 알면 기다림이 짧게 느껴진다. */
      var say = el.querySelector('.boot-say');
      var shown = 0;
      function show(p, words) {
        p = Math.max(0, Math.min(100, p));
        if (p > shown) shown = p;             // 띠는 뒤로 가지 않는다
        var v = Math.round(shown * 10) / 10;  // 소수 한 자리 — 잘게 움직이는 것이 보인다
        if (bar) bar.style.width = v + '%';
        if (num) num.textContent = v.toFixed(1) + '%';
        if (words && say && say.textContent !== words) say.textContent = words;
      }
      var BAKE_MAX_MS = 8000;                  // 땅 굽기에 내주는 최대 시간
      var SETTLE_MAX_MS = 12000;               // 자리 잡기에 내주는 최대 시간(둘레 땅 굽기까지 여기서 한다)
      var SETTLE_NEED = 10;                    // 이만큼 잇달아 가벼워야 「잦아들었다」로 본다
      var SETTLE_MS = 24;                      // 한 프레임 그리기가 이보다 빠르면 가볍다(≈40fps)

      /* ③ 자리 잡기 — 진짜로 그려 본다. 처음 만들어질 것이 다 만들어지고 나면 값이 뚝 떨어진다. */
      function settleLoop(until, streak, seen) {
        if (over) return;
        var ms = 0;
        try { ms = GM.world && GM.world.warmFrame ? GM.world.warmFrame() : 0; } catch (e) { ms = 0; }
        streak = ms <= SETTLE_MS ? streak + 1 : 0;
        seen += 1;
        show(80 + 20 * Math.min(1, streak / SETTLE_NEED), '화면을 다듬는 중…');
        if ((streak >= SETTLE_NEED && seen >= SETTLE_NEED) || Date.now() > until) {
          show(100, '들어갑니다');
          setTimeout(close, 240);
          return;
        }
        requestAnimationFrame(function () { settleLoop(until, streak, seen); });
      }
      /* ② 땅 굽기 */
      function bakeLoop(until) {
        if (over) return;
        var r = null;
        try { r = warm(); } catch (e) { r = { done: true, ratio: 1 }; }
        show(45 + 35 * ((r && r.ratio) || 0), '땅을 펼치는 중…');
        if ((r && r.done) || Date.now() > until) { settleLoop(Date.now() + SETTLE_MAX_MS, 0, 0); return; }
        requestAnimationFrame(function () { bakeLoop(until); });
      }
      function afterImages() {
        if (typeof warm !== 'function') {
          setTimeout(close, Math.max(0, 700 - (Date.now() - began)));
          return;
        }
        show(45, '땅을 펼치는 중…');
        bakeLoop(Date.now() + BAKE_MAX_MS);
      }
      function tick() {
        k += 1;
        show(k / n * 45, '그림을 내려받는 중…');
        if (k >= n) afterImages();
      }
      if (!n) { afterImages(); return; }
      urls.forEach(function (u) {
        var im = new Image();
        im.onload = tick; im.onerror = tick;
        im.src = u;
      });
      setTimeout(close, BOOT_MAX_MS + BAKE_MAX_MS + SETTLE_MAX_MS);  // 무슨 일이 있어도 이야기는 시작된다
    }
  };

  function step() {
    done += 1;
    var pct = Math.round(done / total * 100);
    if (fill) fill.style.width = pct + '%';
    if (count) count.textContent = pct + '%';
    if (done >= total) ready();
  }
  /* 다 받았어도 ① 쪽(page)이 다 서고 ② 최소 시간이 지나야 걷는다.
     「왜」 — 두 번째 접속부터는 그림이 전부 곳간에 있어 백 분의 몇 초 만에 100%가 된다.
     그러면 화면이 뜨자마자 사라져 「안 뜬다」로 보인다. 기다림이 없으면 없는 대로 보여 준다. */
  function ready() {
    if (done < total || !pageLoaded) return;
    var wait = Math.max(0, BOOT_MIN_MS - (Date.now() - startedAt));
    setTimeout(finish, wait);
  }
  function finish() {
    if (settled) return;
    settled = true;
    if (!screen) return;
    screen.classList.add('is-gone');
    setTimeout(function () { if (screen && screen.parentNode) screen.parentNode.removeChild(screen); }, 420);
  }
  if (document.readyState === 'complete') { pageLoaded = true; }
  else window.addEventListener('load', function () { pageLoaded = true; ready(); });
  list.forEach(function (src) {
    var im = new Image();
    im.onload = step;
    im.onerror = step;                  // 없는 그림 하나가 첫 화면을 붙잡아서는 안 된다
    im.src = src;
  });
  if (!total) { done = 0; total = 0; ready(); }
  setTimeout(finish, BOOT_MAX_MS);
})();
</script>
