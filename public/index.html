<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2b1d12">
<title>갈래말래</title>
<!-- ★ 연출·메뉴용 세리프 폰트(Noto Serif KR, OFL) — CDN 없이 저장소에 동봉한다 -->
<link rel="stylesheet" href="assets/fonts/noto-serif-kr/noto-serif-kr.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ══════ 배경 장식 (항상 맨 뒤 · 클릭 통과) ══════
     규칙: 장식 요소는 반드시 class="decor" + pointer-events:none. harness/check_ui.mjs 가 검사한다. -->
<canvas id="sky" class="decor sky" aria-hidden="true"></canvas>

<!-- ══════ 장면 1 · 타이틀 ══════ -->
<section id="scene-title" class="scene scene-title">
  <!-- ★ 메인 홈 일러스트에 메뉴 문구(새로하기·이어하기·멀티플레이)가 구워져 있다.
       판(plate)을 상단 기준으로 세워 로고가 잘리지 않게 하고, 글자 위에는 투명 핫스팟만 얹는다
       (호버하면 그 자리가 밝아지고 금줄이 선다 — main.css .title-hot). -->
  <div class="title-plate">
    <button id="btn-new" type="button" class="title-hot" aria-label="새로하기" title="새로하기"></button>
    <button id="btn-load" type="button" class="title-hot" aria-label="이어하기" title="이어하기"></button>
    <button id="btn-join" type="button" class="title-hot" aria-label="멀티플레이" title="멀티플레이"></button>
  </div>
  <div class="title-wrap" hidden>
    <canvas id="crest" class="decor crest" aria-hidden="true" width="240" height="180"></canvas>
    <h1 class="game-logo">갈래말래</h1>
    <p class="game-tag">마차가 멈춘 자리에 모닥불 하나. 도끼질로 시작해 정착지를 키운다.</p>
  </div>
  <p id="title-status" class="scene-status" role="status"></p>
  <p class="scene-foot">서버 없이 화면만 둘러보려면 주소 끝에 <code>?mock=1</code></p>
</section>

<!-- ══════ 장면 2 · 새로하기 ══════
     ★ 홈(타이틀)·메뉴 판과 같은 옷 — 배경은 메인 일러스트, 판은 양피지 타일 액자(assets/ui/tile_square),
       이름 칸은 슬롯 그림(assets/ui/menu/slot.png), 큰 단추는 파란 판(assets/ui/menu/btn_blue.png),
       글은 세리프(main.css .found-*). 「뒤로」는 판 바깥 아래 가운데에 글자만 선다.
     ★ 「그대의 모습」(외형 선택)은 뺐다 — 주민 NPC 로 모습이 통일이라 고를 것이 없다. -->
<section id="scene-found" class="scene scene-found" hidden>
  <div class="found-wrap">
    <h2 class="found-title">새로하기</h2>
    <p class="found-sub">새로운 여정을 시작하세요</p>

    <input id="found-name" class="found-name-in" type="text" maxlength="16"
           placeholder="그대의 이름" autocomplete="off" spellcheck="false">
    <p id="found-kingdom" class="kingdom-preview">이름을 적으면 정착지의 이름이 정해집니다.</p>

    <h3 class="found-sec">어떤 길로 갈까</h3>
    <div id="found-diff" class="diff-grid"></div>

    <div class="found-go">
      <button id="found-start" type="button" class="found-primary" disabled>마차에 오른다</button>
      <p id="found-summary" class="found-summary"></p>
    </div>

    <details id="found-custom" class="fold">
      <summary>보조 옵션</summary>
      <label class="switch">
        <input id="found-assist" type="checkbox" checked>
        <span class="sw-box"></span>
        <span>자리를 비운 사이 정착지가 알아서 굴러가게 한다</span>
      </label>
      <p class="hint">역할은 마을(주민 12명)이 되는 날 「감정의 날」에 정해집니다.</p>
    </details>

    <!-- ★ 뒤로 — 메뉴 판들과 같이 판 **안** 아래 가운데(판이 길어도 화면 밖으로 밀려나지 않는다) -->
    <button id="found-back" type="button" class="found-back">뒤로</button>
  </div>

  <p id="found-status" class="scene-status" role="status"></p>
</section>

<!-- ══════ 장면 3 · 멀티플레이 / 이어하기 ══════
     한 장면이 두 낯을 가진다 — [멀티플레이](닉네임·초대 코드·파티 참가·방 만들기)와
     [이어하기](초대 코드·여정 불러오기). 판은 일러스트 액자(assets/ui/menu)이고
     제목·부제·입력·단추는 그 홈 위에 얹는다(main.css .menu-panel). -->
<section id="scene-load" class="scene scene-menu" hidden>
  <div id="menu-panel" class="menu-panel mode-join">
    <h2 id="menu-title" class="menu-title">멀티플레이</h2>
    <p id="menu-sub" class="menu-sub">동료와 함께 여정을 시작하세요</p>
    <input id="load-name" class="menu-in menu-in-name" type="text" maxlength="16"
           placeholder="닉네임" autocomplete="off">
    <input id="load-gameid" class="menu-in menu-in-code" type="text"
           placeholder="초대 코드" autocomplete="off" spellcheck="false">
    <button id="load-go" type="button" class="menu-primary">파티 참가</button>
    <button id="load-create" type="button" class="menu-secondary">방 만들기</button>
    <button id="load-back" type="button" class="menu-back">뒤로</button>
  </div>
  <p id="load-status" class="scene-status" role="status"></p>
</section>

<!-- ══════ 게임 화면 ══════ -->
<div id="shell" class="shell" hidden>

  <!-- 상단 자원 바 -->
  <header id="topbar" class="topbar">
    <div id="res-bar" class="res-bar" aria-label="창고"></div>
    <div class="topbar-right">
      <span id="tb-kingdom" class="tb-kingdom"></span>
      <!-- ★ 「내 모습」(군주 외형 편집)은 뺐다 — 주민 NPC 로 모습 통일, 커스터마이징 없음 -->
      <button id="btn-chronicle" type="button" class="icon-btn" aria-label="연대기" title="연대기">✎</button>
      <button id="btn-sound" type="button" class="icon-btn" aria-label="소리 켜기·끄기" title="소리">♪</button>
      <button id="btn-settings" type="button" class="icon-btn" aria-label="설정" title="설정 (Esc)">⚙</button>
      <button id="btn-help" type="button" class="icon-btn" aria-label="도움말" title="도움말">?</button>
    </div>
  </header>

  <!-- 중앙 무대 — 월드 캔버스가 주인공이다 -->
  <div id="stage" class="stage">
    <canvas id="world-canvas" class="world-canvas" tabindex="0" aria-label="우리 땅"></canvas>

    <div class="hud hud-tl">
      <div id="badge-tier" class="tier-badge"></div>
      <div id="badge-day" class="cal-badge"></div>
      <!-- GDD3 §15-C — 자동 플레이가 도는 동안 켜지는 표시 -->
      <div id="badge-auto" class="auto-badge" hidden>자동</div>
      <!-- ★ GDD3 §16-16 — 다가오는 것들: 웨이브·연구·주민·승격 카운트다운 -->
      <div id="upcoming" class="upcoming decor" aria-hidden="true" hidden></div>
      <button id="badge-threat" type="button" class="inv-badge" hidden></button>
      <div id="goal-card" class="goal-card" hidden></div>
      <div id="artifact-track-card" class="artifact-track-card" hidden></div>
      <button id="artifact-journal-btn" class="artifact-journal-btn" type="button"><img class="aj-ic" src="assets/ui/codex/icon_discovery.png" alt="">발견 기록</button>
      <button id="artifact-inventory-btn" class="artifact-journal-btn" type="button"><img class="aj-ic" src="assets/ui/codex/icon_artifact.png" alt="">유물 보관함</button>
    </div>

    <div id="battle-bar" class="battle-bar" hidden></div>

    <div id="notices" class="notices" aria-label="알림"></div>

    <aside id="social-panel" class="social-panel" aria-label="함께 개척하는 이들"></aside>

    <div id="minimap-wrap" class="minimap-wrap">
      <canvas id="minimap" class="minimap" aria-label="축소 지도"></canvas>
    </div>

    <div id="place-bar" class="place-bar" hidden></div>

    <div id="context-panel" class="ctx-panel" hidden></div>

    <!-- ★ GDD3 §14-5 — 나의 상태: 초상 · HP · XP · 레벨 -->
    <div id="me-panel" class="me-panel" aria-label="나의 상태" hidden></div>

    <div id="toolbar" class="toolbar"></div>

    <footer id="cabinet" class="cabinet" hidden></footer>

    <div id="vignette" class="decor vignette" aria-hidden="true"></div>
  </div>
</div>

<!-- 이펙트 층 — 자원 팝이 월드에서 상단 자원칸까지 날아간다 (항상 클릭 통과) -->
<canvas id="fx-layer" class="decor fx-layer" aria-hidden="true"></canvas>

<!-- 공용 레이어 -->
<!-- ★ GDD3 §13-D-1 — 새 사람이 올 때 뜨는 능력치 카드가 여기에 쌓인다 -->
<div id="fx-cards" class="fx-cards" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="banner-root" class="banner-root" aria-live="polite"></div>
<!-- ★ §19-D — 화면 한가운데 큰 제목(새 땅에 들어설 때 · 날이 바뀔 때). 장식이라 클릭을 먹지 않는다. -->
<div id="epic-root" class="epic-root decor" aria-live="polite"></div>
<div id="tooltip" class="tooltip decor" role="tooltip" hidden></div>
<div id="modal-root"></div>
<div id="coach-root"></div>
<!-- ★ §17-19(D-5) — 대화창(탐험기획 §18-6). 지도를 덮지 않고 화면 아래에서만 말한다. -->
<div id="dialogue-root"></div>
<div id="cutscene-root"></div>

<!-- 개발 패널 (Ctrl+` 로만 열린다) -->
<aside id="dev-panel" class="dev-panel" hidden></aside>

<!-- ══════════ ★ 배포 D-1 — 서버 주소 (docs/DEPLOY2.md §4-2) ══════════
     클라 사본은 GitHub Pages 에 얹히고 서버는 딴 데 있다. 그 둘을 잇는 **한 줄**이 여기다 —
     호스팅을 갈아탈 때 고칠 곳은 아래 SERVER 한 줄뿐이다(심사 중 이중화도 이 한 줄로 한다).
     서버가 직접 내려준 사본(로컬 npm start·같은 도메인)에서는 빈 문자열이라 옛날처럼 상대경로로 돈다. -->
<script>
  window.GM = window.GM || {};
  GM.SERVER = (function () {
    var q = new URLSearchParams(location.search).get('server');
    if (q) return q.replace(/\/+$/, '');                      // ?server=... 로 그 자리에서 갈아끼운다
    var remote = /\.github\.io$/.test(location.hostname) || location.protocol === 'file:';
    if (!remote) return '';                                   // 서버가 내려준 사본 = 같은 출처
    return 'https://gallaemallae-production.up.railway.app';  // ★ D-2 에서 확정하면 이 줄만 고친다
  })();
</script>
<!-- socket.io 클라 — Pages(`/tojiGame/` 하위)에서는 절대경로 `/socket.io/...` 가 404 라 CDN 으로 받는다.
     CDN 이 막힌 망에서는 서버가 직접 내주는 사본으로 물러선다(net.js 보다 **먼저** 서야 해서 동기 삽입이다). -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"
        onerror="window.__socketIoCdnFailed=true"></script>
<script>
  if (window.__socketIoCdnFailed && typeof window.io !== 'function') {
    document.write('<script src="' + (GM.SERVER || '') + '/socket.io/socket.io.js"'
      + ' onerror="window.__socketIoMissing=true"><\/script>');
  }
</script>
