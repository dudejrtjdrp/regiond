<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regiond · 건물 테스트 월드</title>
<link rel="icon" href="assets/regiond-icon-purple-transparent/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/regiond-icon-purple-transparent/favicon-32.png">
<link rel="stylesheet" href="css/building-lab.css">
</head>
<body>
<header class="lab-head">
  <div><strong>Regiond · 건물 테스트 월드</strong><span>실제 게임 스프라이트 · 칸 수를 바꿔가며 자유 배치</span></div>
  <nav><a href="museum.html">수작업 에셋룸</a><a href="/">게임으로</a></nav>
</header>
<main class="lab-layout">
  <aside class="control-panel">
    <label>배치할 건물<select id="building-select"></select></label>
    <p id="building-desc" class="desc"></p>
    <div class="size-row"><label>가로 칸<input id="foot-w" type="number" min="1" max="12" value="2"></label><label>세로 칸<input id="foot-h" type="number" min="1" max="12" value="2"></label></div>
    <label>표시 크기 <input id="visual-scale" type="range" min="0.5" max="2" step="0.05" value="1"></label>
    <output id="scale-value">100%</output>
    <p class="hint">격자를 클릭하면 선택한 건물을 배치합니다. 이미 놓인 건물을 클릭하면 선택되며, 칸 수를 바꾸면 즉시 반영됩니다.</p>
    <div class="actions"><button id="remove-selected">선택 건물 삭제</button><button id="clear-world" class="danger">전부 비우기</button></div>
    <p id="status" class="status">건물을 선택하고 초원 격자를 클릭하세요.</p>
  </aside>
  <section class="world-wrap">
    <div id="hq-stage-strip" class="hq-stage-strip" aria-label="정착지 단계별 본부"></div>
    <canvas id="lab-world" width="1152" height="768" aria-label="건물 배치 테스트 월드"></canvas>
    <p class="world-note">휠 버튼 드래그: 화면 이동 · 휠: 확대/축소 · 우클릭: 선택 건물 삭제</p>
  </section>
</main>
<script src="js/ui.js"></script>
<script src="js/atlas.js?v=tier-assets-4"></script>
<script src="js/building-lab.js"></script>
</body>
</html>
